[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentltl"
version = "0.1.0"
description = "FOLTL constraint verification for LLM agent traces"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["llm", "agents", "ltl", "compliance", "verification", "smolagents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Testing",
]
# Zero hard dependencies for the core FOLTL engine
dependencies = []

[project.optional-dependencies]
smolagents = [
    "smolagents>=1.22.0",
    "mcpadapt>=0.1.13",
]
langchain = [
    "langchain>=1.0",
    "langgraph>=0.2",
    "langchain-core>=0.3",
]
native = [
    "openai>=1.0",
]
cli = [
    "cli-to-tools @ git+https://github.com/lailanelkoussy/cli-to-tools.git",
]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
]

[project.urls]
Homepage = "https://github.com/your-org/agentltl"
Issues = "https://github.com/your-org/agentltl/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
