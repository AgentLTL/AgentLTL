# AgentLTL rulebook: extract, validate, transform, load.
#
# For agents that run ETL steps as tools.
# Tool names are placeholders (fetch_data, check_schema, validate_data, transform, load,
# fetch_users, fetch_orders, build_report): rename them to yours.

name: data_pipeline
description: 'Extract, validate, transform, load.'

rules:
  - name: schema_check_before_transform
    formula: 'before("check_schema", "transform")'
    severity: SOFT_BLOCK
    weight: 2
    description: 'The input schema is checked before transforming.'
    repair: 'Call check_schema on the input, then transform.'

  - name: validate_before_load
    formula: 'G(now("load") -> O(now("validate_data")))'
    severity: HARD_STOP
    weight: 3
    description: 'Nothing is loaded before the data is validated.'
    repair: 'Call validate_data, then load.'

  # Loading twice duplicates rows unless the load is idempotent.
  - name: single_load
    formula: 'called_n("load", <= 1)'
    severity: PERSISTENT_BLOCK
    weight: 2
    description: 'The data is loaded once.'
    repair: 'The data is already loaded; do not load it again.'

  # Fan-in: both sources are fetched before the report that joins them.
  - name: fan_in_before_report
    formula: 'all_before(["fetch_users", "fetch_orders"], "build_report")'
    severity: SOFT_BLOCK
    weight: 2
    description: 'The report waits for both sources.'
    repair: 'Call fetch_users and fetch_orders before build_report.'

  # in_order is a subsequence check: other calls may come in between. A missing stage
  # can still come later, so it is judged at the end (TOLERATE).
  - name: pipeline_order
    formula: 'in_order(["fetch_data", "validate_data", "transform", "load"])'
    severity: TOLERATE
    weight: 1
    description: 'The pipeline runs fetch, validate, transform, load.'
    repair: 'Complete the missing pipeline stages in order.'
    applies_to_final_answer: true
