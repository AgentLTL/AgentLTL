# AgentLTL rulebook: actions a person confirms first.
#
# For agents acting on someone's behalf: sending, publishing, sharing, deleting.
# Tool names are placeholders (ask_user_confirmation, send_email, publish_post,
# share_externally, user_confirm_deletion, delete_account): rename them to yours.
#
# Y = the call just before: the confirmation is for THIS action, not one from earlier.
# ASK hands the decision to a human when the confirmation is missing; without a human
# in the loop the harness treats it as PERSISTENT_BLOCK.

name: human_in_the_loop
description: 'Actions a person confirms first.'

rules:
  - name: confirm_before_send
    formula: 'G(now("send_email") -> Y(now("ask_user_confirmation")))'
    severity: ASK
    weight: 2
    description: 'Each email is confirmed by the user just before it is sent.'
    repair: 'Call ask_user_confirmation with the draft, then send it.'

  - name: confirm_before_publish
    formula: 'G(now("publish_post") -> Y(now("ask_user_confirmation")))'
    severity: ASK
    weight: 2
    description: 'Each public post is confirmed by the user just before it goes out.'
    repair: 'Call ask_user_confirmation with the post, then publish it.'

  - name: confirm_before_external_share
    formula: 'G(now("share_externally") -> Y(now("ask_user_confirmation")))'
    severity: ASK
    weight: 3
    description: 'Each external share is confirmed by the user just before it happens.'
    repair: 'Call ask_user_confirmation naming the recipient, then share.'

  # Each deletion needs its own confirmation right before it. (The previous form,
  # '(!now("delete_account")) W now("user_confirm_deletion")', let one confirmation
  # cover every later deletion.)
  - name: confirm_before_delete
    formula: 'G(now("delete_account") -> Y(now("user_confirm_deletion")))'
    severity: PERSISTENT_BLOCK
    weight: 3
    description: 'Each account deletion is confirmed by the user just before.'
    repair: 'Call user_confirm_deletion first.'
