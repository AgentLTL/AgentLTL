# AgentLTL rulebook: payments and trading.
#
# For agents that pay suppliers, refund or place orders.
# Tool names are placeholders (verify_identity, check_sanctions, match_invoice,
# approve_payment, add_beneficiary, callback_verification, execute_payment, get_quote,
# place_order): rename them to yours.
#
# The language compares argument values for equality only, so amount thresholds
# ("approval above 10 000 EUR") cannot be written here: use a Predicate in Python.

name: payments
description: 'Payments and trading.'

rules:
  # all_before: every listed check happens before the first payment (multi-input gate).
  - name: kyc_before_payment
    formula: 'all_before(["verify_identity", "check_sanctions"], "execute_payment")'
    severity: HARD_STOP
    weight: 3
    description: 'The payee is identified and screened before any payment.'
    repair: 'Call verify_identity and check_sanctions before execute_payment.'

  # Three-way match: a payment settles an invoice that was matched to an order.
  - name: invoice_match_before_payment
    formula: 'G(now("execute_payment") -> O(now("match_invoice")))'
    severity: HARD_STOP
    weight: 2
    description: 'A payment settles an invoice matched to its order and receipt.'
    repair: 'Call match_invoice for this invoice, then pay.'

  # Four-eyes principle: count_before counts the approvals made earlier in the run. It
  # cannot tell who approved; make approve_payment refuse a repeated approver.
  - name: four_eyes_approval
    formula: 'G(now("execute_payment") -> count_before(now("approve_payment"), >= 2))'
    severity: ASK
    weight: 3
    description: 'A payment needs two approvals.'
    repair: 'Get a second approve_payment before executing.'

  # Anti-fraud (fake supplier, changed bank details): if a beneficiary was added in this
  # run, it was confirmed by calling back a known contact before any payment.
  - name: callback_for_new_beneficiary
    formula: 'G(now("execute_payment") -> (O(now("add_beneficiary")) -> O(now("callback_verification"))))'
    severity: ASK
    weight: 3
    description: 'A new beneficiary is confirmed by call-back before it is paid.'
    repair: 'Call callback_verification on a known contact for the new beneficiary.'

  - name: single_payment
    formula: 'called_n("execute_payment", <= 1)'
    severity: PERSISTENT_BLOCK
    weight: 2
    description: 'A payment is executed once (no duplicates).'
    repair: 'The payment was already executed; do not repeat it.'

  # Y = the call just before: the quote is fresh, nothing happened in between.
  - name: fresh_quote_before_order
    formula: 'G(now("place_order") -> Y(now("get_quote")))'
    severity: SOFT_BLOCK
    weight: 2
    description: 'An order is placed right after a quote.'
    repair: 'Call get_quote immediately before place_order.'
