# AgentLTL rulebook: purchasing and anti-corruption.
#
# For purchasing agents (quotes, awards) and for gift / hospitality handling.
# Tool names are placeholders (request_quote, check_budget, check_conflict_of_interest,
# award_contract, accept_gift, register_gift): rename them to yours.
#
# Thresholds by amount (competitive tender above X) need a Predicate in Python; the
# rules here apply to every award.

name: procurement
description: 'Purchasing and anti-corruption.'

rules:
  # Conflict of interest: the people involved are checked against the bidders.
  - name: conflict_check_before_award
    formula: 'G(now("award_contract") -> O(now("check_conflict_of_interest")))'
    severity: HARD_STOP
    weight: 3
    description: 'No contract is awarded before a conflict-of-interest check.'
    repair: 'Call check_conflict_of_interest for the bidders.'

  # Competition: count_before counts the quotes requested earlier in the run.
  - name: three_quotes_before_award
    formula: 'G(now("award_contract") -> count_before(now("request_quote"), >= 3))'
    severity: PERSISTENT_BLOCK
    weight: 2
    description: 'A contract is awarded after at least 3 quotes.'
    repair: 'Request more quotes before awarding.'

  - name: budget_check_before_award
    formula: 'G(now("award_contract") -> O(now("check_budget")))'
    severity: PERSISTENT_BLOCK
    weight: 2
    description: 'The budget line is checked before committing to a contract.'
    repair: 'Call check_budget for this purchase.'

  - name: single_award
    formula: 'called_n("award_contract", <= 1)'
    severity: PERSISTENT_BLOCK
    weight: 2
    description: 'One award per purchase.'
    repair: 'The contract is already awarded; do not award it again.'

  # X = the very next call: an accepted gift is registered immediately.
  - name: register_gift
    formula: 'G(now("accept_gift") -> X(now("register_gift")))'
    severity: SOFT_BLOCK
    weight: 2
    description: 'An accepted gift is registered right away.'
    repair: 'Call register_gift now.'
